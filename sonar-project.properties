sonar.projectKey=gabor_ferrent_dcc673cc-9b07-496b-8b48-ea24ebde06f8
sonar.projectName=Ferrent
# Fallback only: the CI job overrides this with the Cargo.toml version.
sonar.projectVersion=0.1.0
# SonarQube Community Build ships no Rust (or C++) analyzer, so the .rs files
# are indexed without a language and only the web UI, CI glue and packaging
# files are measured. Rust quality comes from clippy as external issues
# (ci/clippy_to_sonar.py); see docs/ci.md.
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Test files live next to the sources, so both roots are the repo itself and
# every *.spec.ts is classified as a test file instead of production code.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/test_*.py
sonar.exclusions=target/**,**/target/**,**/*.lock,**/node_modules/**,webui/dist/**,webui/test-results/**,webui/coverage/**,crates/gui/spikes/**,dist/**,docs/images/**,.qwen/**,.playwright-mcp/**,ci/coverage.xml
# The web UI coverage comes from vitest (webui-coverage job → lcov.info), the
# CI helper coverage from pytest (ci-tests job → cobertura XML). The service
# worker lives in public/ and is not importable by vitest, so it is excluded
# from coverage accounting instead of counting as fully uncovered.
sonar.javascript.lcov.reportPaths=webui/coverage/lcov.info
sonar.python.coverage.reportPaths=ci/coverage.xml
sonar.coverage.exclusions=webui/public/**
sonar.qualitygate.wait=true
