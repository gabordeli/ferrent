name: perf

# Nightly regression check against ci/perf-baseline.json: restore time, RSS and
# the list p95 must stay within 10% of the stored numbers.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtorrent-rasterbar-dev libboost-dev pkg-config libssl-dev
      - name: build
        run: cargo build --release -p ferrent-daemon
      - name: measure
        run: bash ci/perf.sh 1000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-result
          path: perf-result.json
          if-no-files-found: warn
