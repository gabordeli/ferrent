name: release-apt

# Signs the .deb files that the GitLab pipeline attached to the GitHub release
# (packaging/apt/publish-github-release.sh) and publishes the signed APT
# repository on the gh-pages branch. There is no build here: the canonical
# build only runs once, on GitLab.
#
# The GitLab job dispatches this workflow after the uploads; a `release:
# published` trigger would race the per-file asset uploads.
#
# Repository settings -> Pages -> Source: "Deploy from a branch", branch
# gh-pages, folder "/". Secrets: GPG_PRIVATE_KEY (base64 of the armored secret
# key), GPG_KEY_ID (the fingerprint) and GPG_PASSPHRASE (the key's passphrase);
# see packaging/apt/README.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (empty = the latest release)
        default: ""

permissions:
  contents: write

concurrency:
  group: release-apt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: sign and publish the repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName -q .tagName)
          fi
          echo "FERRENT_TAG=$tag" >> "$GITHUB_ENV"
          echo "publishing $tag"

      - name: Download the .deb assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p dist
          gh release download "$FERRENT_TAG" --pattern '*.deb' --dir dist
          ls -l dist
          [ -n "$(ls -A dist)" ] || { echo "::error::no .deb assets on $FERRENT_TAG"; exit 1; }

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::the GPG_PRIVATE_KEY secret is missing; the repository cannot be signed"
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}'

      - name: Write the signing passphrase
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::the GPG_PASSPHRASE secret is missing; the repository cannot be signed"
            exit 1
          fi
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/gpg-passphrase" >> "$GITHUB_ENV"

      - name: Check out gh-pages (or start it empty)
        run: |
          set -e
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            # A remote-tracking ref alone gives a detached worktree; -B makes
            # the local gh-pages branch so the push below has a ref.
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
          fi

      - name: Sign and publish the repository
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          # The site carries the current release only: the pool is rebuilt from
          # this release's assets, so a deleted version disappears from Pages.
          APT_REPO_PRUNE: "1"
        run: |
          set -e
          packaging/apt/build-repo.sh site dist
          install -m 0644 packaging/apt/keyring/ferrent.gpg site/ferrent.gpg
          printf '%s\n' \
            '<!doctype html>' '<meta charset="utf-8">' \
            '<title>Ferrent APT repository</title>' \
            '<h1>Ferrent APT repository</h1>' \
            '<p>Install instructions: docs/apt-install.md in the ferrent repository.</p>' \
            > site/index.html
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "::notice::the repository tree did not change"
          else
            git -C site -c user.name="ferrent-bot" \
              -c user.email="ferrent-bot@users.noreply.github.com" \
              commit -m "apt: publish ${FERRENT_TAG}"
            git -C site push origin HEAD:gh-pages
          fi
