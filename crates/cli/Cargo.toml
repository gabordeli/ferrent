[package]
name = "ferrent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "ferrent-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ferrent-i18n = { path = "../i18n" }
ferrent-import = { path = "../import" }
ferrent-protocol = { path = "../protocol" }
ferrent-telemetry = { path = "../telemetry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tonic = { version = "0.14", features = ["tls-ring"] }

[dev-dependencies]
ferrent-daemon = { path = "../daemon" }
ferrent-engine = { path = "../engine" }
libc = "0.2"
