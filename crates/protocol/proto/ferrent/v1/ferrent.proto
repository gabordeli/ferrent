syntax = "proto3";

package ferrent.v1;

// Ferrent daemon control API.
service Ferrent {
  // Adds a torrent from raw metainfo bytes.
  rpc AddTorrent(AddTorrentRequest) returns (AddTorrentResponse);
  // Pauses a torrent.
  rpc PauseTorrent(PauseTorrentRequest) returns (PauseTorrentResponse);
  // Resumes a torrent.
  rpc ResumeTorrent(ResumeTorrentRequest) returns (ResumeTorrentResponse);
  // Removes a torrent.
  rpc RemoveTorrent(RemoveTorrentRequest) returns (RemoveTorrentResponse);
  // Returns one torrent snapshot.
  rpc GetTorrent(GetTorrentRequest) returns (GetTorrentResponse);
  // Returns a filtered, sorted, paginated torrent list.
  rpc ListTorrents(ListTorrentsRequest) returns (ListTorrentsResponse);
  // Returns aggregate daemon status for the server list.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Returns the file list of one torrent.
  rpc GetTorrentFiles(GetTorrentFilesRequest) returns (GetTorrentFilesResponse);

  // Replaces the per-file priorities of one torrent (0 skip, 1 low, 4 normal,
  // 7 high). The list must have one entry per file, in file order.
  rpc SetFilePriorities(SetFilePrioritiesRequest) returns (SetFilePrioritiesResponse);

  // Builds a .torrent for a file or directory on the daemon host.
  rpc CreateTorrent(CreateTorrentRequest) returns (CreateTorrentResponse);

  // Per-feed state of the RSS watcher.
  rpc GetRssStatus(GetRssStatusRequest) returns (GetRssStatusResponse);

  // Re-verifies the existing data against the piece hashes.
  rpc RecheckTorrent(RecheckTorrentRequest) returns (RecheckTorrentResponse);
  rpc SetSequential(SetSequentialRequest) returns (SetSequentialResponse);
  rpc SetSuperSeeding(SetSuperSeedingRequest) returns (SetSuperSeedingResponse);

  // Adds or removes one announce URL on a torrent.
  rpc AddTracker(AddTrackerRequest) returns (AddTrackerResponse);
  rpc RemoveTracker(RemoveTrackerRequest) returns (RemoveTrackerResponse);
  // Reads or replaces the web seed (HTTP mirror) list of one torrent.
  rpc GetWebSeeds(GetWebSeedsRequest) returns (GetWebSeedsResponse);
  rpc SetWebSeeds(SetWebSeedsRequest) returns (SetWebSeedsResponse);
  // Reloads the configured IP blocklist sources.
  rpc RefreshBlocklist(RefreshBlocklistRequest) returns (RefreshBlocklistResponse);
  // Session totals and counters for the stats view.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // Renames one file inside a torrent (index from GetTorrentFiles).
  rpc RenameTorrentFile(RenameTorrentFileRequest) returns (RenameTorrentFileResponse);
  // Returns the connected peers of one torrent.
  rpc GetTorrentPeers(GetTorrentPeersRequest) returns (GetTorrentPeersResponse);
  // Returns the trackers of one torrent.
  rpc GetTorrentTrackers(GetTorrentTrackersRequest) returns (GetTorrentTrackersResponse);
  // Streams torrent deltas to the client.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // Moves a torrent up or down in the download queue.
  rpc MoveTorrent(MoveTorrentRequest) returns (MoveTorrentResponse);
  // Returns the configuration document and its revision.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // Replaces the configuration if the revision is current.
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
  // Lists label definitions and assignment counts.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  // Creates a label.
  rpc CreateLabel(CreateLabelRequest) returns (LabelResponse);
  // Updates a label.
  rpc UpdateLabel(UpdateLabelRequest) returns (LabelResponse);
  // Deletes a label and clears its assignments.
  rpc DeleteLabel(DeleteLabelRequest) returns (DeleteLabelResponse);
  // Assigns (or clears) a torrent's label.
  rpc SetTorrentLabel(SetTorrentLabelRequest) returns (SetTorrentLabelResponse);
  // Overrides per-torrent limits, or clears the override.
  rpc SetTorrentLimits(SetTorrentLimitsRequest) returns (SetTorrentLimitsResponse);
  // Returns the AutoAdd watch directories with their runtime counters.
  rpc GetAutoAddStatus(GetAutoAddStatusRequest) returns (GetAutoAddStatusResponse);
  // Scans one watch directory (or all of them) immediately.
  rpc ScanAutoAdd(ScanAutoAddRequest) returns (ScanAutoAddResponse);
  // Returns the hook journal depth and the most recent runs.
  rpc GetHookStatus(GetHookStatusRequest) returns (GetHookStatusResponse);
  // Returns the notification outbox counters.
  rpc GetNotificationStatus(GetNotificationStatusRequest) returns (GetNotificationStatusResponse);
  // Queues a test delivery to every enabled webhook.
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);
  // Returns the storage payload: filesystems, zones and free space.
  rpc GetDisks(GetDisksRequest) returns (GetDisksResponse);
}

message GetNotificationStatusRequest {}
message GetNotificationStatusResponse {
  // Deliveries waiting for (or retrying) a send.
  uint32 pending = 1;
  // Deliveries that exhausted their attempts.
  uint32 dead = 2;
  // Enabled webhook channels in the configuration.
  uint32 channels = 3;
}

message SendTestNotificationRequest {}
message SendTestNotificationResponse {
  uint32 queued = 1;
}

message GetHookStatusRequest {
  // Maximum number of recent runs; `0` uses the server default of 20.
  uint32 limit = 1;
}

// One completed hook execution.
message HookRun {
  string event = 1;
  uint64 torrent_id = 2;
  string torrent_name = 3;
  string command = 4;
  // `true` when the process exited with status 0.
  bool succeeded = 5;
  // Exit code; `0` when the process did not exit normally.
  int32 exit_code = 6;
  bool timed_out = 7;
  uint64 duration_ms = 8;
  string stdout = 9;
  string stderr = 10;
  int64 at_unix = 11;
}

message GetHookStatusResponse {
  // Unacknowledged journal events.
  uint32 pending = 1;
  repeated HookRun runs = 2;
}

// One configured watch directory and what the scanner has done with it.
message AutoAddDirStatus {
  string path = 1;
  bool enabled = 2;
  string label = 3;
  // Destination of the move action, when configured.
  string move_to = 4;
  // Files waiting for the size/mtime stability check.
  uint32 pending = 5;
  // Torrents added since the daemon started.
  uint32 added = 6;
  // Duplicate files accepted without a second torrent.
  uint32 duplicates = 7;
  // Files renamed to `.invalid`.
  uint32 invalid = 8;
  string last_error = 9;
  // Unix seconds of the last completed scan; `0` when it never ran.
  int64 last_scan_unix = 10;
  // Files kept in the watch directory because the free-space gate is low.
  uint32 deferred = 11;
}

message GetAutoAddStatusRequest {}
message GetAutoAddStatusResponse {
  repeated AutoAddDirStatus dirs = 1;
}

message ScanAutoAddRequest {
  // Watch path to scan; empty scans every enabled directory.
  string path = 1;
}
message ScanAutoAddResponse {
  uint32 added = 1;
  uint32 duplicates = 2;
  uint32 failed = 3;
  uint32 invalid = 4;
  uint32 deferred = 5;
}

// Request for aggregate daemon status.
message GetStatusRequest {}

// Aggregate daemon status.
message GetStatusResponse {
  // Number of torrents in the mirror.
  uint32 torrent_count = 1;
  // Sum of current download rates in bytes per second.
  uint64 download_rate = 2;
  // Sum of current upload rates in bytes per second.
  uint64 upload_rate = 3;
  // Free bytes on the daemon data directory.
  uint64 free_space_bytes = 4;
  // Torrents per lifecycle state, for the GUI sidebar counters.
  uint32 downloading_count = 5;
  uint32 seeding_count = 6;
  uint32 queued_count = 7;
  uint32 paused_count = 8;
  uint32 error_count = 9;
  uint32 checking_count = 10;
  // Torrents with a non-zero transfer rate.
  uint32 active_count = 11;
  // Torrents whose payload is being moved.
  uint32 moving_count = 12;
  // Scheduler state (M5-T3).
  bool scheduler_enabled = 13;
  // Current slot: "green", "yellow", "red"; empty when disabled.
  string scheduler_level = 14;
  // Unix seconds of the next hour boundary; `0` when disabled.
  int64 scheduler_next_unix = 15;
  // Installed IP blocklist ranges; `0` when none is loaded.
  uint32 blocklist_ranges = 16;
  // Unix seconds of the last successful blocklist load; `0` when never.
  int64 blocklist_refreshed_unix = 17;
  // Last blocklist load error; empty when the filter is healthy.
  string blocklist_error = 18;
}

// Request to add a torrent.
message AddTorrentRequest {
  // Display name.
  string name = 1;
  // Raw .torrent metainfo bytes.
  bytes metainfo = 2;
  // Save path on the daemon host.
  string save_path = 3;
  // Known size in bytes, or zero when unknown.
  uint64 total_bytes = 4;
  // Label whose staging folder receives the download; empty for none.
  string label = 5;
  // Magnet URI; used when `metainfo` is empty.
  string magnet = 6;
  // Download the pieces in order (streaming-friendly).
  bool sequential = 7;
}

// Response with the engine-assigned torrent id.
message AddTorrentResponse {
  // Torrent id.
  uint64 id = 1;
  // True when the same info hash was already present; the id is the existing
  // torrent.
  bool duplicate = 2;
}

// Request for the storage payload.
message GetDisksRequest {}

// One storage zone (a labelled library folder or a staging folder).
message DiskZone {
  // Absolute path on the daemon host.
  string path = 1;
  // Label of a library zone; empty for a staging zone.
  string label = 2;
  // True when this is the download folder of its filesystem.
  bool staging = 3;
  bool enabled = 4;
}

// One filesystem with the zones that live on it.
message Disk {
  // Longest mount point of the filesystem.
  string mount = 1;
  // Source device from the mount table.
  string device = 2;
  // Filesystem type.
  string fs = 3;
  uint64 total_bytes = 4;
  uint64 free_bytes = 5;
  uint64 used_bytes = 6;
  // True when free space is below the configured floor.
  bool low = 7;
  // Torrents whose save path is on this filesystem.
  uint32 torrents = 8;
  // Labels whose library zone lives here.
  repeated string labels = 9;
  repeated DiskZone zones = 10;
}

message GetDisksResponse {
  repeated Disk disks = 1;
  // Configured paths that could not be mapped to a filesystem.
  repeated string unknown = 2;
  uint64 total_free_bytes = 3;
  uint64 min_free_bytes = 4;
  uint64 margin_bytes = 5;
  bool enabled = 6;
}

// Request to pause a torrent.
message PauseTorrentRequest {
  // Torrent id.
  uint64 id = 1;
}

// Response of a successful pause.
message PauseTorrentResponse {}

// Request to resume a torrent.
message ResumeTorrentRequest {
  // Torrent id.
  uint64 id = 1;
}

// Response of a successful resume.
message ResumeTorrentResponse {}

// Request to remove a torrent.
message RemoveTorrentRequest {
  // Torrent id.
  uint64 id = 1;
  // Delete the torrent's downloaded files from the save path.
  bool delete_files = 2;
}

// Response of a successful removal.
message RemoveTorrentResponse {}

// Direction of a queue move.
enum QueueDirection {
  // Defaults to up.
  QUEUE_DIRECTION_UNSPECIFIED = 0;
  // Move the torrent towards the front of the queue.
  QUEUE_DIRECTION_UP = 1;
  // Move the torrent towards the back of the queue.
  QUEUE_DIRECTION_DOWN = 2;
}

// Request to move a torrent in the download queue.
message MoveTorrentRequest {
  // Torrent id.
  uint64 id = 1;
  // Which way to move.
  QueueDirection direction = 2;
}

// Response of a successful queue move.
message MoveTorrentResponse {}

// Request for the current configuration.
message GetConfigRequest {}

// The current configuration document.
message GetConfigResponse {
  // Raw TOML, preserving comments and formatting.
  string toml = 1;
  // Revision to pass to SetConfig.
  uint64 revision = 2;
  // Keys overridden by the environment; SetConfig cannot change them.
  repeated string env_locked = 3;
}

// Request to replace the configuration.
message SetConfigRequest {
  // Complete TOML document.
  string toml = 1;
  // Revision from GetConfig; a stale revision is rejected.
  uint64 revision = 2;
}

// Response of a successful configuration change.
message SetConfigResponse {
  // The new revision.
  uint64 revision = 1;
}

// A label definition.
message Label {
  // Lowercase name; unique.
  string name = 1;
  // Optional #RRGGBB or #RRGGBBAA colour.
  string color = 2;
  // Optional move-on-complete target.
  string move_completed_path = 3;
  // Per-torrent limits; zero means inherit.
  uint64 download_rate_limit = 4;
  uint64 upload_rate_limit = 5;
  uint32 connections_limit = 6;
  uint32 upload_slots_limit = 7;
  // Tracker URL substrings for auto-assignment.
  repeated string match_trackers = 8;
  // Name regex for auto-assignment.
  string match_name = 9;
}

// A label plus its assignment count.
message LabelEntry {
  Label label = 1;
  uint32 torrent_count = 2;
}

message ListLabelsRequest {}
message ListLabelsResponse {
  repeated LabelEntry labels = 1;
}

message CreateLabelRequest {
  Label label = 1;
}
message UpdateLabelRequest {
  Label label = 1;
}
message LabelResponse {
  Label label = 1;
}

message DeleteLabelRequest {
  string name = 1;
}
message DeleteLabelResponse {
  bool removed = 1;
  uint32 cleared_assignments = 2;
}

message SetTorrentLabelRequest {
  uint64 id = 1;
  // Empty clears the assignment.
  string label = 2;
}
message SetTorrentLabelResponse {
  // Effective label; empty when unlabelled.
  string label = 1;
}

message SetTorrentLimitsRequest {
  uint64 id = 1;
  uint64 download_rate_limit = 2;
  uint64 upload_rate_limit = 3;
  uint32 connections_limit = 4;
  uint32 upload_slots_limit = 5;
  // Clears the manual override and falls back to the label/session policy.
  bool clear = 6;
}
message SetTorrentLimitsResponse {}

// Request for one torrent snapshot.
message GetTorrentRequest {
  // Torrent id.
  uint64 id = 1;
}

// Response with one torrent snapshot.
message GetTorrentResponse {
  // Torrent snapshot.
  Torrent torrent = 1;
}

// Lifecycle state of a torrent.
enum TorrentState {
  // Unspecified state.
  TORRENT_STATE_UNSPECIFIED = 0;
  // Queued for the engine.
  TORRENT_STATE_QUEUED = 1;
  // Checking files or resume data.
  TORRENT_STATE_CHECKING = 2;
  // Downloading or fetching metadata.
  TORRENT_STATE_DOWNLOADING = 3;
  // Download finished; seeding.
  TORRENT_STATE_SEEDING = 4;
  // Paused.
  TORRENT_STATE_PAUSED = 5;
  // Engine error; see the `error` field for details.
  TORRENT_STATE_ERROR = 6;
  // The payload is being moved to a new save path.
  TORRENT_STATE_MOVING = 7;
}

// Snapshot of one torrent.
message Torrent {
  // Torrent id.
  uint64 id = 1;
  // Display name.
  string name = 2;
  // Total size in bytes.
  uint64 total_bytes = 3;
  // Lifecycle state.
  TorrentState state = 4;
  // Completion ratio in 0.0..=1.0.
  float progress = 5;
  // Current download rate in bytes per second.
  uint64 download_rate = 6;
  // Current upload rate in bytes per second.
  uint64 upload_rate = 7;
  // Error message when the state is TORRENT_STATE_ERROR.
  string error = 8;
  // Connected seeds reported by the engine.
  uint32 seeds = 9;
  // Connected peers reported by the engine.
  uint32 peers = 10;
  // Estimated seconds to completion; zero when unknown.
  uint32 eta_seconds = 11;
  // Directory the torrent's files are written to, as the daemon resolved it.
  string save_path = 12;
  // Position in the download queue; negative when the engine has none.
  int32 queue_position = 13;
  // v1 info hash as 40 lowercase hex characters.
  string infohash = 14;
  // Active pause reasons: 1 user, 2 scheduler, 4 disk guard, 8 ratio.
  uint32 pause_reasons = 15;
  // Assigned label name; empty when unlabelled.
  string label = 16;
  // Pieces are requested in order (streaming mode).
  bool sequential = 17;
  // The torrent seeds without advertising itself as a full seed.
  bool super_seeding = 18;
}

// Sort key for the torrent list.
enum SortField {
  // Defaults to id.
  SORT_FIELD_UNSPECIFIED = 0;
  // Sort by torrent id.
  SORT_FIELD_ID = 1;
  // Sort by display name.
  SORT_FIELD_NAME = 2;
  // Sort by completion ratio.
  SORT_FIELD_PROGRESS = 3;
  // Sort by download rate.
  SORT_FIELD_DOWNLOAD_RATE = 4;
  // Sort by upload rate.
  SORT_FIELD_UPLOAD_RATE = 5;
  // Sort by download queue position.
  SORT_FIELD_QUEUE = 6;
  // Sort by label name.
  SORT_FIELD_LABEL = 7;
}

// Request for a filtered, sorted, paginated list.
message ListTorrentsRequest {
  // Case-insensitive substring filter on the name; empty means no filter.
  string filter = 1;
  // Sort key.
  SortField sort = 2;
  // Sort descending when true.
  bool descending = 3;
  // Number of matching torrents to skip.
  uint32 offset = 4;
  // Page size; zero means no limit.
  uint32 limit = 5;
  // Restrict the page to one lifecycle state; unspecified means all states.
  TorrentState state_filter = 6;
  // Restrict the page to one label; empty means all labels.
  string label_filter = 7;
}

// One page of torrents plus the total match count.
message ListTorrentsResponse {
  // Torrents in this page.
  repeated Torrent torrents = 1;
  // Total number of torrents matching the query before paging.
  uint32 total = 2;
}

// Request to start a delta stream.
message WatchRequest {}

// One delta from the daemon.
message WatchResponse {
  // The delta kind.
  oneof event {
    // A torrent was added.
    Torrent added = 1;
    // A torrent changed state.
    StateChanged state_changed = 2;
    // A torrent made progress.
    Progress progress = 3;
    // A torrent was removed.
    Removed removed = 4;
    // The configuration changed.
    ConfigChanged config_changed = 5;
    // The torrent reached 100%.
    TorrentFinished finished = 6;
  }
}

// A torrent reached 100% (once per engine lifetime).
message TorrentFinished {
  // Torrent id.
  uint64 id = 1;
}

// A configuration revision change.
message ConfigChanged {
  // The new revision.
  uint64 revision = 1;
}

// State change delta.
message StateChanged {
  // Torrent id.
  uint64 id = 1;
  // New state.
  TorrentState state = 2;
}

// Progress delta.
message Progress {
  // Torrent id.
  uint64 id = 1;
  // Completion ratio in 0.0..=1.0.
  float progress = 2;
  // Current download rate in bytes per second.
  uint64 download_rate = 3;
  // Current upload rate in bytes per second.
  uint64 upload_rate = 4;
  // Position in the download queue; negative when the engine has none.
  int32 queue_position = 5;
}

// Removal delta.
message Removed {
  // Torrent id.
  uint64 id = 1;
}

// One file inside a torrent.
message TorrentFile {
  // Path relative to the torrent root.
  string path = 1;
  // File size in bytes.
  uint64 size = 2;
  // Completion ratio in 0.0..=1.0.
  float progress = 3;
  // Engine priority: 0 skip, 1 low, 4 normal, 7 high.
  int32 priority = 4;
}

message GetTorrentFilesRequest {
  uint64 id = 1;
}

message GetTorrentFilesResponse {
  repeated TorrentFile files = 1;
}

message SetFilePrioritiesRequest {
  uint64 id = 1;
  // One entry per file, in the order returned by GetTorrentFiles.
  repeated int32 priorities = 2;
}

message SetFilePrioritiesResponse {
  repeated TorrentFile files = 1;
}

message CreateTorrentRequest {
  // File or directory on the daemon host.
  string path = 1;
  // Piece size in bytes; 0 picks 256 KiB (clamped to 16 KiB..16 MiB).
  uint32 piece_length = 2;
  // Announce URLs; the daemon's default trackers are added when empty.
  repeated string trackers = 3;
}

message CreateTorrentResponse {
  // Raw .torrent metainfo bytes.
  bytes metainfo = 1;
  // v1 info hash, lowercase hex.
  string infohash = 2;
}

message GetRssStatusRequest {}

// One configured RSS feed and what it has done so far.
message RssFeed {
  string url = 1;
  string label = 2;
  // Unix seconds of the last poll; 0 means "not polled yet".
  uint64 last_poll = 3;
  // Last error, empty on success.
  string error = 4;
  // Torrents added by this feed since the daemon started tracking.
  uint64 added = 5;
  // Item keys remembered for dedupe.
  uint64 seen = 6;
}

message GetRssStatusResponse {
  repeated RssFeed feeds = 1;
}

message RecheckTorrentRequest {
  uint64 id = 1;
}

message RecheckTorrentResponse {}

message SetSequentialRequest {
  // Torrent id.
  uint64 id = 1;
  // Download the pieces in order.
  bool on = 2;
}

message SetSequentialResponse {}

message SetSuperSeedingRequest {
  // Torrent id.
  uint64 id = 1;
  // Seed without advertising a full copy.
  bool on = 2;
}

message SetSuperSeedingResponse {}

message AddTrackerRequest {
  uint64 id = 1;
  // Announce URL (http, https, udp or ws scheme).
  string url = 2;
}

message AddTrackerResponse {}

message RemoveTrackerRequest {
  uint64 id = 1;
  // The announce URL to drop from the torrent.
  string url = 2;
}

message RemoveTrackerResponse {}

message GetWebSeedsRequest {
  uint64 id = 1;
}

message GetWebSeedsResponse {
  // Web seed URLs, in the order libtorrent reports them.
  repeated string urls = 1;
}

message SetWebSeedsRequest {
  uint64 id = 1;
  // Replaces the whole list; an empty list clears it.
  repeated string urls = 2;
}

message SetWebSeedsResponse {
  // The list the engine holds after the change.
  repeated string urls = 1;
}

message RefreshBlocklistRequest {}

message GetStatsRequest {}

message GetStatsResponse {
  // Payload bytes downloaded since each torrent was added, summed.
  uint64 downloaded_bytes = 1;
  // Payload bytes uploaded since each torrent was added, summed.
  uint64 uploaded_bytes = 2;
  // uploaded / downloaded; `0` when nothing was downloaded yet.
  float ratio = 3;
  // Torrents per lifecycle state.
  uint32 torrent_count = 4;
  uint32 downloading_count = 5;
  uint32 seeding_count = 6;
  uint32 queued_count = 7;
  uint32 paused_count = 8;
  uint32 checking_count = 9;
  uint32 error_count = 10;
  uint32 moving_count = 11;
  // Swarm peers reported by the engine, summed over the torrents.
  uint64 peers = 12;
  // Seconds since the daemon started; the session totals restart with it.
  int64 uptime_secs = 13;
  uint64 download_rate = 14;
  uint64 upload_rate = 15;
}

message RefreshBlocklistResponse {
  // Ranges installed after the reload.
  uint32 ranges = 1;
  // Unix seconds of the reload.
  int64 refreshed_unix = 2;
  // Per-source failures; empty on success.
  repeated string errors = 3;
}

message RenameTorrentFileRequest {
  uint64 id = 1;
  // Zero-based index, in the order of GetTorrentFiles.
  uint32 index = 2;
  // New path relative to the torrent root; no '/' allowed for now.
  string name = 3;
}

message RenameTorrentFileResponse {
  repeated TorrentFile files = 1;
}

// One connected peer.
message TorrentPeer {
  string endpoint = 1;
  string client = 2;
  float progress = 3;
  uint64 download_rate = 4;
  uint64 upload_rate = 5;
}

message GetTorrentPeersRequest {
  uint64 id = 1;
}

message GetTorrentPeersResponse {
  repeated TorrentPeer peers = 1;
}

// One tracker announce entry.
message TorrentTracker {
  string url = 1;
  // Machine-readable announce state: working, updating, unverified, error.
  string status = 2;
  uint32 seeds = 3;
  uint32 leechers = 4;
  // The tracker's own message, or the announce error text.
  string message = 5;
  uint32 next_announce = 6;
  uint32 fails = 7;
}

message GetTorrentTrackersRequest {
  uint64 id = 1;
}

message GetTorrentTrackersResponse {
  repeated TorrentTracker trackers = 1;
}
