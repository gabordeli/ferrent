[package]
name = "ferrent-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "ferrent-gui"
path = "src/main.rs"

[dependencies]
ferrent-protocol = { path = "../protocol" }
ferrent-telemetry = { path = "../telemetry" }
ferrent-i18n = { path = "../i18n" }
chrono = "0.4.45"
iced = { version = "0.13", features = ["canvas", "image", "tokio"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
ferrent-daemon = { path = "../daemon" }
ferrent-engine = { path = "../engine" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
