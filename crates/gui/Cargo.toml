[package]
name = "ferrent-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ferrent desktop thin client (iced)"

[lints]
workspace = true

[[bin]]
name = "ferrent-gui"
path = "src/main.rs"

[dependencies]
ferrent-platform = { path = "../platform" }
ferrent-protocol = { path = "../protocol" }
ferrent-telemetry = { path = "../telemetry" }
ferrent-i18n = { path = "../i18n" }
chrono = "0.4.45"
iced = { version = "0.13", features = ["canvas", "image", "tokio"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
toml_edit = "0.22"

[build-dependencies]
ferrent-winres = { path = "../winres" }

[dev-dependencies]
ferrent-daemon = { path = "../daemon" }
ferrent-engine = { path = "../engine" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[package.metadata.deb]
name = "ferrent-gui"
maintainer = "Gabor Deli <gabor.deli@gmail.com>"
copyright = "2026, Gabor Deli"
license-file = ["../../LICENSE", "0"]
extended-description = "Ferrent desktop thin client (iced)."
section = "net"
priority = "optional"
# The symbols are kept by packaging/debian/build.sh (`cargo deb --no-strip`):
# cargo-deb 3.8 has no `strip` metadata key, and the SDK resolves panic frames
# in-process, so a stripped binary reports `<unknown>` frames to Bugsink.
# $auto resolves the GTK/iced runtime packages from the binary.
depends = "$auto"
# The client points at any daemon over TLS; a local one is the convenient case,
# not a requirement (a laptop installs the GUI only).
recommends = "ferrent"
assets = [
    ["target/release/ferrent-gui", "usr/bin/", "755"],
    ["../../packaging/appimage/ferrent.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/128x128/apps/ferrent.png", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/ferrent.png", "644"],
]
