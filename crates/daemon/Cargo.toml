[package]
name = "ferrent-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
libtorrent = ["ferrent-engine/libtorrent"]

[[bin]]
name = "ferrentd"
path = "src/main.rs"

[[bin]]
name = "crash_writer"
path = "src/bin/crash_writer.rs"

[dependencies]
arc-swap = "1"
ferrent-engine = { path = "../engine" }
ferrent-protocol = { path = "../protocol" }
rcgen = "0.14"
redb = "2"
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14", features = ["tls-ring"] }
