spec:
  inputs:
    release_type:
      default: patch
      options:
        - patch
        - minor
        - major
      description: "Release version bump, used when release_version is empty."
    release_version:
      default: ""
      description: "Explicit version (0.1.1 or 0.1.1-rc1); overrides release_type."
---

stages:
  - cleanup
  - quality
  - sonar
  - version
  - release

variables:
  RELEASE_TYPE: "$[[ inputs.release_type ]]"
  RELEASE_VERSION: "$[[ inputs.release_version ]]"

# The project runner is a shell executor, so run the tools in Docker explicitly.
# A previous Docker run can leave root-owned build files; the cleanup job fixes
# the workspace before GitLab's checkout/clean step.
cleanup-workspace:
  stage: cleanup
  variables:
    GIT_STRATEGY: none
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src"
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
        alpine sh -c 'chown -R "$HOST_UID:$HOST_GID" /src/target /src/clippy.json /src/sonar-issues.json 2>/dev/null || true'

# SonarQube Community Build does not ship an active Rust analyzer; Clippy
# diagnostics are imported as Sonar generic issues.
clippy-report:
  stage: quality
  variables:
    CARGO_TERM_COLOR: never
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" -w /src
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
        -e CARGO_TARGET_DIR=/tmp/ferrent-target
        rust:1.100-slim sh -c '
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
          libxrandr-dev libxi-dev libglib2.0-dev libgtk-3-dev libssl-dev pkg-config python3
          build-essential libtorrent-rasterbar-dev &&
        rustup component add clippy &&
        cargo clippy --workspace --all-targets --message-format=json > /tmp/clippy.json &&
        python3 ci/clippy_to_sonar.py /tmp/clippy.json /tmp/sonar-issues.json &&
        cp /tmp/sonar-issues.json /src/sonar-issues.json &&
        chown "$HOST_UID:$HOST_GID" /src/sonar-issues.json'
  artifacts:
    paths:
      - sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The GitHub mirror also runs buf; lint the canonical side first so a broken
# proto fails here, not only on the mirror.
buf-lint:
  stage: quality
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace
        bufbuild/buf:1.50.0 lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Windows binaries are cross-built here: the runner is the only CI host and the
# Windows VM is a manual test box, not a runner. mingw gives real .exe files
# (the MSVC target would need cl.exe for ring's C), and the same target backs
# `cargo check` in the port, so a Unix-ism fails the pipeline.
# The daemon needs libtorrent; it is cross-built into a cached prefix, so the
# CMake build runs once per toolchain change, not per pipeline.
windows-cross:
  stage: quality
  variables:
    CARGO_TERM_COLOR: never
  script:
    # The container runs as root, so `target/` must already exist owned by the
    # runner user: a root-created target/ makes the next job's `git clean` fail
    # on the artifact directory (measured, pipeline 6935).
    - mkdir -p target/windows "$HOME/.cache/ferrent-lt-win"
    - docker run --rm -v "$CI_PROJECT_DIR:/src" -v "$HOME/.cache/ferrent-lt-win:/cache"
        -w /src
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
        -e CARGO_TARGET_DIR=/tmp/ferrent-win -e LT_PREFIX=/cache/prefix
        rust:1.100-slim sh -c '
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends
          gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake make pkg-config
          libboost-dev curl file &&
        rustup target add x86_64-pc-windows-gnu &&
        packaging/windows/build-libtorrent.sh "$LT_PREFIX" &&
        PKG_CONFIG_ALLOW_CROSS=1 PKG_CONFIG_PATH="$LT_PREFIX/lib/pkgconfig"
          FERRENT_LIBTORRENT_STATIC=1 RUSTFLAGS="-C link-args=-static"
          cargo build --release --target x86_64-pc-windows-gnu
            -p ferrent-daemon -p ferrent-cli -p ferrent-gui &&
        packaging/windows/stage-artifacts.sh
          "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/release" /src/target/windows &&
        file /src/target/windows/*.exe &&
        chown -R "$HOST_UID:$HOST_GID" /src/target /cache'
  artifacts:
    paths:
      - target/windows/*.exe
      - target/windows/libstdc++-6.dll
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The web UI coverage feeds Sonar's new-coverage gate; the scanner does not run
# npm itself, so the lcov report is produced here and passed as an artifact.
webui-coverage:
  stage: quality
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" -w /src/webui
        -u "$(id -u):$(id -g)"
        -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache
        node:22-bookworm sh -c 'npm ci --no-audit --no-fund && npm run test:coverage'
  artifacts:
    paths:
      - webui/coverage/lcov.info
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Same contract for the CI helper scripts: the clippy→Sonar converter feeds
# the quality gate, so it is unit tested and its coverage goes to Sonar too.
ci-tests:
  stage: quality
  script:
    # Mount at /usr/src, the scanner's base dir, so the cobertura <source>
    # element maps without an "invalid directory path" warning.
    - docker run --rm -v "$CI_PROJECT_DIR:/usr/src" -w /usr/src
        -u "$(id -u):$(id -g)"
        -e HOME=/tmp -e PIP_CACHE_DIR=/tmp/pip -e PYTHONDONTWRITEBYTECODE=1
        python:3.12-slim sh -c '
        pip install -q --retries 5 --timeout 60 -r ci/requirements.txt &&
        python -m coverage run --source=ci -m pytest ci -q &&
        python -m coverage report -m &&
        python -m coverage xml -o ci/coverage.xml'
  artifacts:
    paths:
      - ci/coverage.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sonarqube:
  stage: sonar
  needs:
    - clippy-report
    - webui-coverage
    - ci-tests
  variables:
    GIT_DEPTH: "0"
  script:
    - docker run --rm
        -v "$CI_PROJECT_DIR:/usr/src" -w /usr/src
        -e SONAR_HOST_URL -e SONAR_TOKEN
        sonarsource/sonar-scanner-cli:latest
        -Dsonar.projectVersion="$(bash packaging/debian/version.sh --cargo)"
        -Dsonar.externalIssuesReportPaths=sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Manual release from the GitLab UI ("Run pipeline" on main): the version comes
# from release_version (or a patch/minor/major bump), the job bumps Cargo.toml,
# commits and tags it, and the build below works from that commit.
release-version:
  stage: version
  needs: []
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash .gitlab/release-version.sh
  artifacts:
    reports:
      dotenv: tmp/release.env
    paths:
      - tmp/release.env

# Builds both architectures and publishes them to the Debian Package Registry.
# A missing GITLAB_TOKEN is fine for a plain tag pipeline (CI_JOB_TOKEN uploads),
# but the manual release needs it for the commit/tag push.
release-deb:
  stage: release
  needs:
    - job: release-version
      artifacts: true
      optional: true
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    - packaging/debian/version.sh --self-test
    - if [ -n "${RELEASE_COMMIT:-}" ]; then git fetch -q origin && git checkout -q "$RELEASE_COMMIT"; fi
    - tag="${RELEASE_TAG:-$CI_COMMIT_TAG}"
    - packaging/debian/version.sh "$tag"
    - TAG="$tag" packaging/debian/build.sh debian:12 amd64
    - TAG="$tag" packaging/debian/build.sh debian:12 arm64
    - packaging/debian/container-test.sh debian:12 target/debian-dist/ferrent_*_amd64.deb
    # The GitHub release is the path the server and the APT repo consume, so it
    # goes before the registry upload: a registry hiccup must not block it.
    - ': "${GITHUB_RELEASE_TOKEN:?set the GITHUB_RELEASE_TOKEN CI variable}"'
    - GITHUB_TOKEN="$GITHUB_RELEASE_TOKEN" packaging/apt/publish-github-release.sh "$tag" target/debian-dist
    - bash packaging/apt/publish-gitlab.sh target/debian-dist
  artifacts:
    paths:
      - target/debian-dist/*.deb
    expire_in: 30 days

# The GUI AppImage comes from the same release commit and lands next to the
# .deb files: a separate job because it needs a GTK-capable builder, not the
# static-libtorrent one.
release-appimage:
  stage: release
  needs:
    - job: release-version
      artifacts: true
      optional: true
    - job: release-deb
      artifacts: true
      optional: true
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    - if [ -n "${RELEASE_COMMIT:-}" ]; then git fetch -q origin && git checkout -q "$RELEASE_COMMIT"; fi
    - tag="${RELEASE_TAG:-$CI_COMMIT_TAG}"
    - packaging/debian/version.sh "$tag" >/dev/null
    - packaging/appimage/container-build.sh debian:12
    # Smoke: install the daemon from the .deb, then let the AppImage connect to
    # it under Xvfb. `rows=` in the output is the proof of the TLS profile.
    - deb=$(ls target/debian-dist/ferrent_*_amd64.deb | head -1)
    - docker run --rm -v "$CI_PROJECT_DIR:/src" -w /src debian:12
        sh -c 'apt-get update -qq
        && apt-get install -y -qq --no-install-recommends xvfb xauth
        && packaging/appimage/smoke.sh dist/Ferrent-*.AppImage '"$deb"''
    - packaging/appimage/publish.sh dist
  artifacts:
    paths:
      - dist/Ferrent-*.AppImage
    expire_in: 30 days
