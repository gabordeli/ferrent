spec:
  inputs:
    release_type:
      default: patch
      options:
        - patch
        - minor
        - major
      description: "Release version bump, used when release_version is empty."
    release_version:
      default: ""
      description: "Explicit version (0.1.1 or 0.1.1-rc1); overrides release_type."
---

stages:
  - cleanup
  - quality
  - sonar
  - version
  - release

variables:
  RELEASE_TYPE: "$[[ inputs.release_type ]]"
  RELEASE_VERSION: "$[[ inputs.release_version ]]"

# The project runner is a shell executor, so run the tools in Docker explicitly.
# A previous Docker run can leave root-owned build files; the cleanup job fixes
# the workspace before GitLab's checkout/clean step.
cleanup-workspace:
  stage: cleanup
  variables:
    GIT_STRATEGY: none
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src"
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
        alpine sh -c 'chown -R "$HOST_UID:$HOST_GID" /src/target /src/clippy.json /src/sonar-issues.json 2>/dev/null || true'

# SonarQube Community Build does not ship an active Rust analyzer; Clippy
# diagnostics are imported as Sonar generic issues.
clippy-report:
  stage: quality
  variables:
    CARGO_TERM_COLOR: never
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" -w /src
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
        -e CARGO_TARGET_DIR=/tmp/ferrent-target
        rust:1.100-slim sh -c '
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
          libxrandr-dev libxi-dev libglib2.0-dev libgtk-3-dev libssl-dev pkg-config python3 &&
        rustup component add clippy &&
        cargo clippy --workspace --all-targets --message-format=json > /tmp/clippy.json &&
        python3 ci/clippy_to_sonar.py /tmp/clippy.json /tmp/sonar-issues.json &&
        cp /tmp/sonar-issues.json /src/sonar-issues.json &&
        chown "$HOST_UID:$HOST_GID" /src/sonar-issues.json'
  artifacts:
    paths:
      - sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sonarqube:
  stage: sonar
  needs:
    - clippy-report
  variables:
    GIT_DEPTH: "0"
  script:
    - docker run --rm
        -v "$CI_PROJECT_DIR:/usr/src" -w /usr/src
        -e SONAR_HOST_URL -e SONAR_TOKEN
        sonarsource/sonar-scanner-cli:latest
        -Dsonar.externalIssuesReportPaths=sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Manual release from the GitLab UI ("Run pipeline" on main): the version comes
# from release_version (or a patch/minor/major bump), the job bumps Cargo.toml,
# commits and tags it, and the build below works from that commit.
release-version:
  stage: version
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash .gitlab/release-version.sh
  artifacts:
    reports:
      dotenv: tmp/release.env
    paths:
      - tmp/release.env

# Builds both architectures and publishes them to the Debian Package Registry.
# A missing GITLAB_TOKEN is fine for a plain tag pipeline (CI_JOB_TOKEN uploads),
# but the manual release needs it for the commit/tag push.
release-deb:
  stage: release
  needs:
    - job: release-version
      artifacts: true
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    - packaging/debian/version.sh --self-test
    - if [ -n "${RELEASE_COMMIT:-}" ]; then git fetch -q origin && git checkout -q "$RELEASE_COMMIT"; fi
    - tag="${RELEASE_TAG:-$CI_COMMIT_TAG}"
    - packaging/debian/version.sh "$tag"
    - TAG="$tag" packaging/debian/build.sh debian:12 amd64
    - TAG="$tag" packaging/debian/build.sh debian:12 arm64
    - bash packaging/apt/publish-gitlab.sh target/debian-dist
  artifacts:
    paths:
      - target/debian-dist/*.deb
    expire_in: 30 days

probe-debian-api:
  stage: quality
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - printf 'dummy\n' > /tmp/dummy.deb
    - |
      for u in \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ferrentd/0.1.1-1/dummy.deb" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ferrentd/0.1.1-1/dummy2.deb"; do
        printf '== PUT %s -> ' "$u"
        curl -sS -o /tmp/o -w '%{http_code}\n' --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file /tmp/dummy.deb "$u"
        head -c 200 /tmp/o; echo
      done
    - printf '== list packages -> '
    - curl -sS -o /tmp/l -w '%{http_code}\n' --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?per_page=5"
    - head -c 300 /tmp/l; echo
