stages:
  - quality
  - sonar

# The project runner is a shell executor, so run the tools in Docker explicitly.
# SonarQube Community Build does not ship an active Rust analyzer; Clippy
# diagnostics are imported as Sonar generic issues.
clippy-report:
  stage: quality
  variables:
    CARGO_TERM_COLOR: never
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" -w /src rust:1.100-slim sh -c '
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
          libxrandr-dev libxi-dev python3 &&
        rustup component add clippy &&
        cargo clippy --workspace --all-targets --message-format=json > clippy.json &&
        python3 ci/clippy_to_sonar.py clippy.json sonar-issues.json'
  artifacts:
    paths:
      - sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sonarqube:
  stage: sonar
  needs:
    - clippy-report
  variables:
    GIT_DEPTH: "0"
  script:
    - docker run --rm
        -v "$CI_PROJECT_DIR:/usr/src" -w /usr/src
        -e SONAR_HOST_URL -e SONAR_TOKEN
        sonarsource/sonar-scanner-cli:latest
        -Dsonar.externalIssuesReportPaths=sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
