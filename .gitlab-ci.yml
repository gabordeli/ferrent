stages:
  - cleanup
  - quality
  - sonar

# The project runner is a shell executor, so run the tools in Docker explicitly.
# A previous Docker run can leave root-owned build files; the cleanup job fixes
# the workspace before GitLab's checkout/clean step.
cleanup-workspace:
  stage: cleanup
  variables:
    GIT_STRATEGY: none
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src"
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
        alpine sh -c 'chown -R "$HOST_UID:$HOST_GID" /src/target /src/clippy.json /src/sonar-issues.json 2>/dev/null || true'

# SonarQube Community Build does not ship an active Rust analyzer; Clippy
# diagnostics are imported as Sonar generic issues.
clippy-report:
  stage: quality
  variables:
    CARGO_TERM_COLOR: never
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/src" -w /src
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"
        -e CARGO_TARGET_DIR=/tmp/ferrent-target
        rust:1.100-slim sh -c '
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
          libxrandr-dev libxi-dev python3 &&
        rustup component add clippy &&
        cargo clippy --workspace --all-targets --message-format=json > /tmp/clippy.json &&
        python3 ci/clippy_to_sonar.py /tmp/clippy.json /tmp/sonar-issues.json &&
        cp /tmp/sonar-issues.json /src/sonar-issues.json &&
        chown "$HOST_UID:$HOST_GID" /src/sonar-issues.json'
  artifacts:
    paths:
      - sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sonarqube:
  stage: sonar
  needs:
    - clippy-report
  variables:
    GIT_DEPTH: "0"
  script:
    - docker run --rm
        -v "$CI_PROJECT_DIR:/usr/src" -w /usr/src
        -e SONAR_HOST_URL -e SONAR_TOKEN
        sonarsource/sonar-scanner-cli:latest
        -Dsonar.externalIssuesReportPaths=sonar-issues.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
