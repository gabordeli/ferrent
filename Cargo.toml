[workspace]
resolver = "3"
exclude = [
    "crates/gui/spikes/iced-spike",
    "crates/gui/spikes/tauri-spike",
]
members = [
    "crates/protocol",
    "crates/engine",
    "crates/daemon",
    "crates/cli",
    "crates/gui",
    "crates/i18n",
    "crates/import",
    "crates/platform",
    "crates/web",
    "crates/telemetry",
    "crates/winres",
]

[workspace.package]
version = "1.0.0-rc2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://cirice-gitlab.ddns.net/gabor/ferrent"
authors = ["Gabor Deli <gabor.deli@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# A panic in the field must come back with a readable stacktrace (Bugsink
# showed symbol-less frames). Line tables give the file:line without the full
# DWARF, and the .deb keeps the symbols (cargo-deb `strip = false`); verify
# with crates/telemetry/examples/panic-probe.rs.
[profile.release]
debug = "line-tables-only"
