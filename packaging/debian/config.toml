data_dir = "/var/lib/ferrent"
bind = "127.0.0.1:50051"
token_file = "/etc/ferrent/token"

# Ratio / seed-time auto-remove (M8-T3). Zero means "off"; a label can
# override any field by name. `poll_secs` is the evaluation period.
# [ratio]
# enabled = true
# stop_at_ratio = 2.0
# remove_at_ratio = 3.0
# seed_time_hours = 0
# remove_with_data = false
# dry_run = false
# poll_secs = 300
#
# [[ratio.label]]
# name = "music"
# stop_at_ratio = 3.0

# Interface binding and link watching (M8-T4). Empty values keep libtorrent's
# defaults. Setting watch_interface pauses every torrent while that interface
# is gone (e.g. a VPN tunnel), and resumes them once it has been back for
# grace_secs.
# [network]
# listen_interfaces = "0.0.0.0:6881"
# outgoing_interfaces = "wg0"
# watch_interface = "wg0"
# grace_secs = 60
# Outbound proxy: none | http | http_pw | socks5 | socks5_pw
# proxy_type = "socks5"
# proxy_host = "127.0.0.1"
# proxy_port = 1080
# proxy_username = ""
# proxy_password = ""
# proxy_peer_connections = true
# Peer encryption: enabled | forced | disabled
# encryption = "enabled"
# upnp = true
# natpmp = true

# Optional Prometheus endpoint (M8-T4). Off by default; a token requires
# `Authorization: Bearer <token>` on every scrape.
# [metrics]
# enabled = true
# listen = "127.0.0.1:9898"
# token = ""
